baseURL: "https://belov.expert/"
languageCode: "en-us"
title: "Sergey Belov | Cybersecurity Expert"
theme: "cyberguard"

# Enable minification for production
minify:
  disableCSS: false
  disableHTML: false
  disableJS: false
  disableJSON: false
  disableSVG: false
  disableXML: false
  minifyOutput: true

# Enable multilingual support
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

# Language configuration
languages:
  en:
    languageName: "English"
    weight: 1
    title: "Sergey Belov | Cybersecurity Expert"
    params:
      description: "Sergey Belov — cybersecurity expert, Head of Banking Systems Security Research Department at Positive Technologies. Banking security research, penetration testing, application security."
      knowsAbout:
        - "Cybersecurity"
        - "Banking systems security"
        - "Application security"
        - "Penetration testing"
        - "Payment security"
        - "Anti-fraud"
        - "Reverse engineering"
        - "Secure software development lifecycle"
  ru:
    languageName: "Русский"
    weight: 2
    title: "Сергей Белов | Эксперт по кибербезопасности"
    params:
      description: "Сергей Белов — эксперт по кибербезопасности, руководитель отдела исследований безопасности банковских систем в Positive Technologies. Пентест, безопасность приложений, антифрод."
      knowsAbout:
        - "Кибербезопасность"
        - "Безопасность банковских систем"
        - "Безопасность приложений"
        - "Тестирование на проникновение"
        - "Безопасность платёжных систем"
        - "Антифрод"
        - "Реверс-инжиниринг"
        - "Безопасная разработка"

params:
  author: "Sergey Belov"
  # Identity used to build the Person entity in structured data
  person:
    names:
      en: "Sergey Belov"
      ru: "Сергей Белов"
    handles:
      - "Kaimi"
      - "kaimi_ru"
      - "kaimi_io"
    images:
      - path: "images/sebelovl.webp"
        width: 1731
        height: 909
      - path: "images/sebelov.webp"
        width: 1122
        height: 1402
    employer:
      name: "Positive Technologies"
      url: "https://www.ptsecurity.com/"
  # Contact information
  contact:
    email: "sergey@belov.expert"
    telegram: "@kaimi_ru"
  # Publications display settings
  publications:
    defaultDisplay: 6  # Number of publications to show initially
  # Social links
  social:
    linkedin: "https://linkedin.com/in/bserg"
    twitter: "https://twitter.com/kaimi_io"
    github: "https://github.com/kaimi-"
    telegram: "https://t.me/kaimi_ru"
    instagram: "https://www.instagram.com/kaimi_ru/"
    blog: "https://kaimi.io/"
    habr: "https://habr.com/ru/users/kaimi_ru/"
    ctftime: "https://ctftime.org/user/14667"
    hackerone: "https://hackerone.com/kaimi"
  # Certifications
  certifications:
    - titleKey: "oscpTitle"
      badge: "images/badges/oscp.webp"
      url: "https://credentials.offsec.com/afbc0e6e-1617-462e-8727-2af8fe2e098c"
    - titleKey: "osweTitle"
      badge: "images/badges/oswe.webp"
      url: "https://credentials.offsec.com/be6e60dd-c195-4be8-b410-152c7d1f3023"
    - titleKey: "cehTitle"
      badge: "images/badges/ceh.webp"
    - titleKey: "ecsaTitle"
      badge: "images/badges/ecsa.webp"
    - titleKey: "burpTitle"
      badge: "images/badges/burp.webp"
      url: "https://portswigger.net/web-security/e/c/efea53d0245f4c55"
  # Calendly link
  calendly: "https://calendly.com/sergey-belov/30min"

  # SEO settings
  seo:
    enableOpenGraph: true
    enableTwitterCards: true
    enableSchemaOrg: true
  # Analytics
  googleAnalytics: "G-X5Y7MHB693"
  yandexMetrika: "89537405"

# Navigation menu
menu:
  main:
    - identifier: "home"
      name: "Home"
      url: "/"
      weight: 1
    - identifier: "certifications"
      name: "Certifications"
      url: "/#certifications"
      weight: 2
    - identifier: "portfolio"
      name: "Portfolio"
      url: "/#portfolio"
      weight: 3
    - identifier: "publications"
      name: "Publications"
      url: "/#publications"
      weight: 4
    - identifier: "contact"
      name: "Contact"
      url: "/#contact"
      weight: 5

# Taxonomies
taxonomies:
  # Disable taxonomies by setting empty values
  tag: ""
  category: ""

# Disable rendering of certain sections
disableKinds:
  - taxonomy
  - term

# Enable syntax highlighting
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: "monokai"

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON
    - ROBOTS

# Media types definition to support robots.txt
mediaTypes:
  application/robots+text:
    suffixes:
      - txt
    
outputFormats:
  ROBOTS:
    mediaType: application/robots+text
    baseName: robots
    isPlainText: true
    notAlternative: true

# Caching for improved build time
caches:
  assets:
    dir: ":resourceDir/_gen"
    maxAge: "720h"
  images:
    dir: ":resourceDir/_gen"
    maxAge: "720h"
  modules:
    dir: ":resourceDir/_gen"
    maxAge: "720h"
