<div class="publication-card">
    <div class="publication-content">
        <div class="publication-media">
            <img src="{{ .media_logo | relURL }}" alt="{{ .media_name }}" class="publication-logo" width="48" height="48">
            <div class="publication-source">{{ .media_name }}</div>
        </div>
        <h3 class="publication-title">
            <a href="{{ .url }}" target="_blank" rel="noopener">{{ .title }}</a>
        </h3>
        {{ if .date }}
        <div class="publication-date">{{ .date }}</div>
        {{ end }}
        <a href="{{ .url }}" class="publication-link" target="_blank" rel="noopener">
            {{ i18n "readArticle" }}
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </div>
</div>
