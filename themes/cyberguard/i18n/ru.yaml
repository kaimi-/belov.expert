# Hero Section
- id: heroTitle
  translation: "Сергей Белов — эксперт по кибербезопасности"
- id: heroSubtitle
  translation: "Руководитель отдела исследований безопасности банковских систем в Positive Technologies. С 2023 года исследую защищённость банковских систем — от платёжных сценариев и антифрода до мобильных приложений и АБС. До этого более десяти лет практической ИБ: пентесты, реверс-инжиниринг, построение SSDLC и команд безопасности в финтехе и Big4."
- id: jobTitle
  translation: "Руководитель отдела исследований безопасности банковских систем"
- id: personDescription
  translation: "Сергей Белов — эксперт по кибербезопасности, руководитель отдела исследований безопасности банковских систем в Positive Technologies. Специализируется на безопасности банковских и платёжных систем, тестировании на проникновение, безопасности приложений и антифроде. Более десяти лет практического опыта в финтехе и Big4, регулярно комментирует цифровые риски и финансовое мошенничество для российских и международных СМИ."
- id: learnMore
  translation: "Подробнее"
