- id: bestchangeProcessTitle
  translation: "How the Audit Works"
- id: bestchangeProcessSubtitle
  translation: "Seven steps from agreeing the scope to verification by BestChange"

- id: bestchangeStep1Owner
  translation: "Together"
- id: bestchangeStep1Title
  translation: "Scope and Access"
- id: bestchangeStep1Desc
  translation: "We agree on the boundaries, the environment, and the rules of engagement. For grey-box coverage you provide test accounts and a scope estimate: the number of REST API endpoints, the number of roles to test, and a general description of what the service does."

- id: bestchangeStep2Owner
  translation: "On you"
- id: bestchangeStep2Title
  translation: "Auditor Approval"
- id: bestchangeStep2Desc
  translation: "You tell BestChange that I will be your auditor and receive their confirmation."

- id: bestchangeStep3Owner
  translation: "On me"
- id: bestchangeStep3Title
  translation: "Testing"
- id: bestchangeStep3Desc
  translation: "I audit the security of the service using {{ .blackBox }} testing. I report critical findings as soon as I find them."

- id: bestchangeStep4Owner
  translation: "On me"
- id: bestchangeStep4Title
  translation: "Report"
- id: bestchangeStep4Desc
  translation: "You receive a report describing every finding with reproduction steps, a risk rating, and specific guidance on how to fix it."

- id: bestchangeStep5Owner
  translation: "On you"
- id: bestchangeStep5Title
  translation: "Remediation"
- id: bestchangeStep5Desc
  translation: "You fix the medium, high, and critical risk findings. Low-risk and informational items are left to your discretion."

- id: bestchangeStep6Owner
  translation: "On me"
- id: bestchangeStep6Title
  translation: "Retest"
- id: bestchangeStep6Desc
  translation: "Once the fixes are in place I re-verify the affected areas and record the result, so the final document confirms the issues are closed."

- id: bestchangeStep7Owner
  translation: "On you"
- id: bestchangeStep7Title
  translation: "BestChange Verification"
- id: bestchangeStep7Desc
  translation: "You submit the final report to BestChange for verification."

