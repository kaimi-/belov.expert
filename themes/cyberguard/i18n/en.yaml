- id: bestchangeDeliverableFindings
  translation: "Every finding described with reproduction steps and a risk rating"
- id: bestchangeDeliverableGuidance
  translation: "Specific remediation guidance — what to change and how"
- id: bestchangeDeliverableRetest
  translation: "A retest of the fixes and a final document confirming that the issues are closed"
- id: bestchangeDeliverableSupport
